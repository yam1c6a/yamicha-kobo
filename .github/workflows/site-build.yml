name: Site build
on:
  push:
    branches: [main, 'design/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npm run build
      - run: node scripts/verify-home.mjs
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/design/corporate-refresh-20261114'
        with:
          name: corporate-original-art-review
          path: dist/client/
          if-no-files-found: error
          retention-days: 1
